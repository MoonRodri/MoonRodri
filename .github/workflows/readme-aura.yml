# .github/workflows/readme-aura.yml
name: Generate README

on:
  push:
    branches: [main]
    paths: ['readme.source.md']
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The "Activity pulse" section needs your contribution calendar, which readme-aura does not provide.
      # This step downloads it and hands it to the build as the CONTRIB_WEEKS variable.
      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql -f login="$LOGIN" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar { weeks { contributionDays { weekday contributionCount } } }
                }
              }
            }' > calendar.json || echo '{}' > calendar.json
          WEEKS=$(jq -c '[.data.user.contributionsCollection.contributionCalendar.weeks[] | (.contributionDays | map({key: (.weekday|tostring), value: .contributionCount}) | from_entries) as $d | [range(0;7) | ($d[tostring] // -1)]]' calendar.json 2>/dev/null || true)
          if [ -n "$WEEKS" ]; then echo "CONTRIB_WEEKS=$WEEKS" >> "$GITHUB_ENV"; fi
          rm -f calendar.json

      - name: Generate README
        uses: collectioneur/readme-aura@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          auto_commit: 'false'

      # Removes the thin gap GitHub leaves under inline images, so the blocks look like one piece.
      - name: Remove gaps between images
        run: sed -i 's|<img src=|<img align="top" src=|g' README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/assets
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "regenerate README via readme-aura"
            git push
          fi
